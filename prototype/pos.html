<title>XBar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: Square-plain + Toast-practical POS. Top bar, then:
   Tables = 20-table grid + detail panel on the right · Order = illustrated menu + order panel · Report.
   Single light theme on purpose (bright café counter); every color set explicitly. */
:root{
  color-scheme:light;
  --bg:#eff1f4; --card:#ffffff; --ink:#111317; --ink-2:#3f4651; --mute:#6b7380; --line:#dde1e7; --soft:#e8ebef;
  --blue:#111317; --blue-2:#000000; --blue-soft:#e8ebef; --busy:#ff5a1f; --busy-2:#e8460e; --busy-ink:#ffffff;
  --floor:#e8ebef; --wall:#cfd5dd; --chair:#d2d8df; --chair-2:#adb5c0; --top:#ffffff; --top-2:#c8ced7;
  --sofa:#dde2e8; --sofa-2:#c2c9d2; --ctr:#1f2329; --ctr-2:#2a2f36; --ctr-in:#3a414b;
  --orange:#121212; --orange-soft:#fff0e8; --ghost:#d3d9e0; --red:#e23b3b; --green:#1f9d55; --green-soft:#e6f5ec;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(17,24,39,.05), 0 4px 16px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--font); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased}
button,input{font:inherit; color:inherit}
button{border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
svg{display:block; flex:none}
h1,h2,h3{margin:0; letter-spacing:-.02em}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--card); border-bottom:1px solid var(--line)}
.bar-in{max-width:1440px; margin:0 auto; padding-inline:20px; height:72px; display:flex; align-items:center; gap:16px}
.logo{display:flex; align-items:center}
.logo img{height:34px; width:auto; display:block}
.logo i{width:36px; height:36px; border-radius:10px; background:var(--ink); color:#fff; display:grid; place-items:center; font-style:normal; font-size:17px}
.tabs{display:flex; gap:4px; margin-left:12px; align-self:stretch}
.tabs button{position:relative; height:100%; padding:0 16px; border-radius:0; font-weight:700; font-size:16px; color:var(--mute); display:flex; align-items:center; gap:10px; white-space:nowrap; transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button:hover .ti{color:var(--ink)}
.tabs button .ti{display:grid; place-items:center; color:var(--mute); transition:color .15s}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"] .ti{color:var(--busy)}
.tabs button::after{content:""; position:absolute; left:14px; right:14px; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--busy); transform:scaleX(0); transition:transform .2s}
.tabs button[aria-current="true"]::after{transform:scaleX(1)}
.tabs button .tc{min-width:24px; height:24px; padding:0 7px; border-radius:7px; background:var(--line); color:var(--ink-2); font-size:13px; font-weight:800; display:grid; place-items:center}
.tabs button[aria-current="true"] .tc{background:var(--busy); color:#fff}
.logo{padding-right:20px; border-right:1px solid var(--line); height:36px}
.bar-r{margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--ink-2); font-weight:600; font-size:15px}
.fp{display:flex; align-items:center; gap:10px; height:50px; padding:0 16px; border-radius:14px; background:var(--soft)}
.fp .sep{width:1px; height:20px; background:var(--line)}
.fp i{width:9px; height:9px; border-radius:50%; background:var(--green)}
.clock{font-weight:700; color:var(--ink); font-size:16px}
.me{display:flex; align-items:center; gap:10px; height:50px; padding:0 16px 0 9px; border-radius:14px; background:var(--soft); font-weight:700; color:var(--ink)}
.me b{width:32px; height:32px; border-radius:9px; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:14px}

.wrap{max-width:1440px; margin:0 auto; padding-inline:20px; padding-block:22px 40px}
.split{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:28px; align-items:start}

/* tables screen */
.th{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.th h1{font-size:28px; font-weight:800}
.filters{display:flex; gap:10px; flex-wrap:wrap}
.f{height:46px; padding:0 16px; border-radius:12px; background:var(--card); white-space:nowrap; font-weight:700; font-size:15px; color:var(--ink-2); display:flex; align-items:center; gap:8px}
.f em{font-style:normal; min-width:24px; height:24px; padding:0 7px; border-radius:7px; background:var(--soft); display:grid; place-items:center; font-size:14px; color:var(--ink)}
.f[aria-pressed="true"]{background:var(--ink); color:#fff}
.f[aria-pressed="true"] em{background:rgba(255,255,255,.18); color:#fff}
.take{margin-left:auto; height:46px; padding:0 20px; border-radius:12px; background:var(--card); white-space:nowrap; font-weight:700; display:flex; align-items:center; gap:8px}
.zone{margin-bottom:30px}
.zone h2{font-size:17px; font-weight:700; color:var(--mute); margin-bottom:14px}
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px}
@media (max-width:900px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.t{position:relative; text-align:left; background:var(--card); border-radius:var(--r); padding:20px 22px; min-height:132px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--sh); transition:transform .12s, box-shadow .12s, background .12s}
.t:hover{transform:translateY(-2px)}
.t:active{transform:scale(.98)}
.t .tn{display:flex; justify-content:space-between; align-items:center}
.t .no{font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1}
.t .st{font-size:14px; font-weight:700; padding:4px 10px; border-radius:7px; background:var(--soft); color:var(--mute); white-space:nowrap}
.t .amt{margin-top:auto; font-size:26px; font-weight:800; letter-spacing:-.02em}
.t .meta{font-size:15px; color:var(--mute); font-weight:600}
.t.free .no{color:#9aa2ad}
.t.free .meta{margin-top:auto}
.t.open{background:var(--busy); color:#fff}
.t.bill{background:var(--orange); color:#fff}
.t.open .st,.t.bill .st{background:rgba(255,255,255,.22); color:#fff}
.t.open .meta,.t.bill .meta,.t.open .no,.t.bill .no{color:rgba(255,255,255,.8)}
.t.sel{transform:translateY(-3px); box-shadow:0 14px 30px rgba(17,24,39,.18)}
.t.free.sel{background:#e3e7ec}
.t.open.sel{background:var(--busy-2)}
.t.bill.sel{background:#000000}
.t .dot{position:absolute; top:-7px; left:-7px; min-width:24px; height:24px; padding:0 6px; border-radius:12px; background:var(--red); color:#fff; font-size:13px; font-weight:800; display:grid; place-items:center; border:2px solid var(--bg)}

.panel{background:var(--card); border-radius:20px; box-shadow:var(--sh); position:sticky; top:calc(env(safe-area-inset-top,0px) + 94px); max-height:calc(100vh - 116px); display:flex; flex-direction:column; overflow:hidden}
.ph{padding:20px 22px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.ph h2{font-size:24px; font-weight:800}
.ph p{margin:4px 0 0; color:var(--mute); font-weight:600; font-size:15px}
.pill{font-size:14px; font-weight:700; padding:5px 11px; border-radius:7px; white-space:nowrap}
.pill.open{background:var(--blue-soft); color:var(--blue-2)} .pill.bill{background:var(--orange); color:#fff} .pill.free{background:var(--soft); color:var(--mute)}
.pb{padding:8px 22px; overflow:auto; flex:1}
.mini{display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-weight:600; font-size:17px; align-items:baseline}
.mini > span:last-child{font-weight:800; font-size:18px}
.mini:last-child{border-bottom:0}
.mini b{color:var(--mute)}
.mini .new{display:block; font-size:14px; color:var(--red); font-weight:700}
.pf{padding:16px 22px 22px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
.row{display:flex; justify-content:space-between; align-items:baseline; font-weight:600; color:var(--ink-2)}
.row.total{font-size:18px; color:var(--ink); font-weight:700}
.row.total b{font-size:36px; font-weight:800; letter-spacing:-.02em}
.btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{height:58px; border-radius:14px; font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 12px; white-space:nowrap}
.btn.pri{background:var(--blue); color:#fff}
.btn.dark{background:var(--ink); color:#fff}
.btn.out{background:var(--soft)}
.btn.org{background:var(--orange); color:#fff}
.btn.grn{background:var(--green); color:#fff}
.btn.full{grid-column:1/-1}
.btn:disabled{opacity:.4; cursor:not-allowed}
.n-badge{min-width:26px; height:26px; padding:0 7px; border-radius:7px; background:var(--red); color:#fff; font-size:14px; display:grid; place-items:center}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:20px 22px}
.stat{background:var(--soft); border-radius:14px; padding:14px}
.stat span{display:block; color:var(--mute); font-weight:600; font-size:15px}
.stat b{display:block; font-size:24px; font-weight:800; margin-top:2px}
.stat.hi{background:var(--ink); color:#fff} .stat.hi span{color:#c4cbd4}
.act{padding:0 22px 20px}
.act h3{font-size:17px; font-weight:700; margin:4px 0 6px}
.act div{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-weight:600; font-size:15px}
.act div span{color:var(--mute)}
.empty{padding:28px 10px; text-align:center; color:var(--mute); font-weight:600; font-size:16px; line-height:1.5}

/* order screen */
.oh{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.back{height:48px; padding:0 16px 0 10px; border-radius:12px; background:var(--card); box-shadow:var(--sh); white-space:nowrap; display:flex; align-items:center; gap:6px; font-weight:700}
.oh h1{font-size:28px; font-weight:800}
.oh .pill{font-size:15px}
.search{margin-left:auto; display:flex; align-items:center; gap:8px; height:48px; padding:0 14px; border-radius:12px; background:var(--card); box-shadow:var(--sh); color:var(--mute); min-width:0; flex:0 1 280px}
.search input{border:0; outline:0; background:none; width:100%; font-size:16px; color:var(--ink); min-width:0}
.cats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:22px}
.cat{background:var(--card); border-radius:var(--r); padding:14px; display:flex; align-items:center; gap:12px; text-align:left; box-shadow:var(--sh)}
.cat .ci{width:48px; height:48px; border-radius:12px; background:var(--soft); display:grid; place-items:center}
.cat .ci svg{width:34px; height:34px}
.cat b{display:block; font-size:17px; font-weight:800}
.cat span{font-size:14px; color:var(--mute); font-weight:600}
.cat[aria-pressed="true"]{background:var(--blue); color:#fff}
.cat[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.cat[aria-pressed="true"] .ci{background:#fff}
.cat b{white-space:nowrap}
.menu{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px}
.it{position:relative; background:var(--card); border-radius:var(--r); padding:12px 12px 16px; box-shadow:var(--sh); text-align:left; display:flex; flex-direction:column; gap:12px}
.it .hit{display:flex; flex-direction:column; gap:12px; text-align:left; transition:transform .1s}
.it .hit:active{transform:scale(.97)}
.it.in .pic{background:var(--blue-soft)}
.it .pic{aspect-ratio:4/3; border-radius:12px; background:var(--soft); display:grid; place-items:center}
.it .pic svg{width:56%; height:auto}
.it .nm{font-size:17px; font-weight:700; line-height:1.25; padding:0 6px}
.it .rw{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 12px; padding:0 6px; margin-top:auto}
.it .pr{font-size:22px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-right:auto}
.it .ctl{display:flex; gap:8px; margin-left:auto}
.it .add,.it .sub{width:44px; height:44px; border-radius:10px; display:grid; place-items:center; flex:none}
.it .add{background:var(--blue); color:#fff}
.it .sub{background:var(--soft); color:var(--ink,#111); box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
.it .add:active,.it .sub:active{transform:scale(.92)}
.it .q{position:absolute; pointer-events:none; top:18px; right:18px; min-width:32px; height:32px; padding:0 8px; border-radius:9px; background:var(--blue); color:#fff; font-weight:800; display:grid; place-items:center; font-size:16px}

.ln{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln .tb{width:52px; height:52px; border-radius:12px; background:var(--soft); display:grid; place-items:center}
.ln .tb svg{width:38px; height:38px}
.ln .nm{font-weight:700; min-width:0; font-size:17px}
.ln .nm .lp{display:block; font-size:19px; font-weight:800; margin-top:2px}
.ln .nm small{display:block; color:var(--mute); font-weight:600; font-size:15px}
.ln .nm small.new{color:var(--blue)}
.step{display:flex; align-items:center; gap:2px; background:var(--soft); border-radius:12px; padding:4px}
.step button{width:40px; height:40px; border-radius:9px; display:grid; place-items:center}
.step button{background:var(--card)}
.step b{min-width:28px; text-align:center; font-size:17px; font-weight:800}

.mbar{display:none}
.ai{min-width:0; max-width:100%; box-sizing:border-box}
input.ai[type="date"]{-webkit-appearance:none; appearance:none; display:block; width:100%; text-align:left; line-height:50px}
input.ai[type="date"]::-webkit-date-and-time-value{text-align:left}
.ap{min-width:0}
button.bs-scrim{border:0; padding:0; width:100%; cursor:default}
.handle{border:0; padding:0}
.calsheet .pf{border-top:1px solid var(--line)}
/* lighter cards */
.t .tn{align-items:flex-start}
.rb{display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 9px; border-radius:8px; background:rgba(255,255,255,.22); color:#fff; font-weight:800; font-size:15px; flex:none}
.rb svg{width:15px; height:15px}
.t.free .meta{color:#9aa2ad}
.rcs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important; gap:12px}
.rc{padding:16px!important; gap:6px!important}
.rc-h{display:flex; align-items:center; gap:10px; min-width:0}
.rc-h b{font-size:15px!important; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.rc-i{width:32px!important; height:32px!important; border-radius:9px!important}
.rc-i svg{width:17px; height:17px}
.rc-a{font-size:24px; font-weight:800; letter-spacing:-.02em; margin:6px 0 8px}
.rc-f{display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:0!important; border-top:0!important; min-height:40px}
.rc-s{display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:700; color:var(--mute)}
.rc-s svg{width:15px; height:15px}
.rc-s.ok{color:var(--green)} .rc-s.soon{color:#c2410c} .rc-s.late{color:var(--red)}
.rc.is-done{opacity:.75}
.rc .pbtn{height:38px; padding:0 14px; font-size:14px}
@media (max-width:1280px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr) 340px}
  .t .no{font-size:28px} .t .amt{font-size:22px}
}

.th-r{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.th-r .take{margin-left:0}
.qline{margin:0 22px 4px; display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:12px; background:var(--soft); font-weight:700; color:var(--ink-2)}
.qline span{display:flex; align-items:center; gap:8px} .qline b{color:var(--ink)}
.qline:hover{background:var(--line)}
.q2{grid-template-columns:minmax(0,1fr) 160px}
.q2 .ai{height:58px; font-size:19px}
.qgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.qc{position:relative; height:132px; border-radius:16px; background:var(--t); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-size:17px; transition:transform .1s}
.qc:active{transform:scale(.97)}
.qc .qi{width:56px; height:56px; display:grid; place-items:center} .qc .qi svg{width:56px; height:56px}
.qc b{font-weight:800; white-space:nowrap}
.qc i{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:8px; background:var(--blue); color:#fff; display:none; place-items:center}
.qc i svg{width:18px; height:18px}
.qc[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--blue)}
.qc[aria-pressed="true"] i{display:grid}
.qhint{margin:-6px 0 0; color:var(--mute); font-weight:600; font-size:15px; min-height:1px}
@media (max-width:720px){ .qgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .qc{height:110px} }
.qt{border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column}
.qt > b{margin-bottom:6px}
.qt div{display:grid; grid-template-columns:52px minmax(0,1fr) auto 44px; gap:10px; align-items:center; padding:6px 0; font-weight:600}
.qt div > span:first-child{color:var(--mute)} .qt small{color:var(--mute); font-weight:600}
.qt .del{width:40px; height:40px}
.tabs button .tc.due{background:var(--orange); color:#fff}
.onav{display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap}
.onav-t{display:flex; gap:4px; padding:4px; background:var(--card); border-radius:14px; box-shadow:var(--sh); flex-wrap:wrap}
.onav-t button{height:44px; padding:0 14px; border-radius:10px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; color:var(--mute); white-space:nowrap}
.onav-t button:hover{color:var(--ink)}
.onav-t button[aria-current="true"]{background:var(--ink); color:#fff}
.onav-t em{font-style:normal; min-width:22px; height:22px; padding:0 6px; border-radius:6px; background:var(--orange); color:#fff; font-size:13px; display:grid; place-items:center}
.onav .btn{margin-left:auto; height:48px}
.calb{padding:18px}
.cw{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px}
.cw span{text-align:center; font-size:14px; font-weight:700; color:var(--mute)}
.cg2{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.cd{min-height:104px; border-radius:12px; background:var(--soft); padding:8px; display:flex; flex-direction:column; gap:4px; text-align:left; min-width:0}
.cd:hover{background:var(--line)}
.cd.out{background:transparent; opacity:.45}
.cd.today{box-shadow:inset 0 0 0 2px var(--blue)} .cd.today .cn{background:var(--blue); color:#fff}
.cd.sel{background:var(--ink)} .cd.sel .cn{color:#fff; background:transparent}
.cn{font-weight:800; font-size:16px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center}
.cc2{display:block; font-size:13px; font-weight:700; padding:3px 6px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cc2.q,.lg i.q{background:#ffe1d3; color:#9a3412} .cc2.e,.lg i.e{background:#e8ebef; color:var(--blue-2)} .cc2.p,.lg i.p{background:#d6f3e1; color:#13733f} .cc2.o,.lg i.o{background:#e5e7eb; color:#374151}
.cc2.done{text-decoration:line-through; opacity:.55}
.cc2.late{background:var(--red); color:#fff}
.cmore{font-size:13px; font-weight:700; color:var(--mute)}
.cal-lg{margin-top:14px}
.calp .pb{max-height:none}
.rmr{display:grid; grid-template-columns:48px minmax(0,1fr) auto 40px; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.rmr .dd{width:48px; height:52px; border-radius:12px; background:var(--soft); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--mute); line-height:1.1}
.rmr .dd b{font-size:19px; color:var(--ink)}
.rmr .rt b{display:block; font-size:16px} .rmr .rt small{color:var(--mute); font-weight:600; font-size:14px}
.rmr.ok .rt b{text-decoration:line-through; color:var(--mute)}
.rs2{font-size:13px; font-weight:700; padding:4px 8px; border-radius:7px; background:var(--soft); color:var(--ink-2); white-space:nowrap}

.ft.bill .fc{background:#121212; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ft.bill .fc .fn{color:#fff} .ft.open .fc .fn{color:var(--busy-ink,#fff)}
.ft.bill .fc .fm{color:rgba(255,255,255,.78)} .ft.open .fc .fm{color:var(--busy-ink,#fff); opacity:.78}
.ft.dim{opacity:.28}
button.ft:hover .fc{transform:translate(-50%,-50%) scale(1.04)}
button.ft:active{transform:scale(.98)}
.ft.sel{filter:drop-shadow(0 10px 18px rgba(17,24,39,.22))}
.ft.sel .fc{outline:3px solid var(--ink); outline-offset:2px}
.room.arr .ft{cursor:grab; pointer-events:auto}
.room.arr .ft.drag{cursor:grabbing; z-index:5; filter:drop-shadow(0 14px 22px rgba(17,24,39,.28))}
.room.arr .ft.on{outline:2.5px dashed var(--blue); outline-offset:6px; border-radius:10px; z-index:4}
.ftb{position:absolute; left:50%; bottom:calc(100% + 12px); transform:translateX(-50%); display:flex; gap:6px; padding:6px; border-radius:14px; background:var(--ink); box-shadow:0 8px 24px rgba(17,24,39,.25); z-index:6; white-space:nowrap}
.ftb.below{bottom:auto; top:calc(100% + 12px)}
.ftb button{height:42px; padding:0 14px; border-radius:10px; color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; gap:7px}
.ftb button:hover{background:rgba(255,255,255,.12)}
.ftb svg{width:17px; height:17px}
.arrbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px 14px 20px; margin-bottom:16px; border-radius:16px; background:var(--blue-soft); color:var(--blue-2); font-weight:700}
.arrbar p{margin:0; flex:1; min-width:240px; line-height:1.4}
.arrbar .step{background:var(--card)}
.arrbar .rl{font-size:15px; color:var(--ink-2)}
.legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; color:var(--mute); font-weight:700; font-size:14px}
.legend span{display:inline-flex; align-items:center; gap:8px}
.legend i{width:14px; height:14px; border-radius:4px; background:var(--top); box-shadow:inset 0 0 0 1.5px var(--top-2)}
.legend i.o{background:var(--busy); box-shadow:none} .legend i.b{background:var(--orange); box-shadow:none}
.tlist{display:none}
.plan-only{display:block}
.pvt{display:none}
/* labels on the plan: the number sits on the table, the money hangs off it as a tag */
.plab{position:absolute; left:calc(50% + var(--cx,0) * var(--u)); top:calc(50% + var(--cy,0) * var(--u)); transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:5px; line-height:1; pointer-events:none}
.plab b{font-size:clamp(20px,3cqw,36px); font-weight:800; letter-spacing:-.03em; color:var(--mute)}
.plab b.nm{font-size:clamp(15px,2.1cqw,24px); letter-spacing:-.02em}
.ft.k-sofa:not(.open):not(.bill) .plab b{color:var(--ink)}
.ft.open .plab b,.ft.bill .plab b{color:#fff}
.ft.k-darts .plab b{color:var(--ink)}
.rdots{display:flex; gap:4px}
.rdots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.9)}
.ft.k-darts .rdots i{background:var(--busy)}
.mtag{position:absolute; left:calc(50% + var(--cx,0) * var(--u)); top:calc(50% + var(--cy,0) * var(--u) + max(var(--tb,40) * var(--u), 30px)); transform:translate(-50%,-50%); display:flex; align-items:baseline; gap:6px; padding:4px 9px; border-radius:9px; background:var(--ink); color:#fff; font-size:clamp(12px,1.35cqw,15px); font-weight:800; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,.18); pointer-events:none}
.mtag i{font-style:normal; font-weight:600; opacity:.6; font-size:.86em}
.room:not(.arr) .ft.sel .tt{stroke:var(--ink); stroke-width:4}
.room:not(.arr) .ft.k-darts.sel .lane{stroke:var(--ink); stroke-width:3}
@media (max-width:720px){
  /* phones: the room keeps a readable size and scrolls sideways; a switch flips to the plain list */
  .plan-wrap{overflow-x:auto; margin-inline:-16px; padding:2px 16px 6px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .plan-wrap::-webkit-scrollbar{display:none}
  .plan-wrap .room.arr{min-width:600px}
  .room.portrait .seat{width:max(26px,3.6cqw); height:max(26px,3.6cqw)}
  .room.portrait .plab b.nm{font-size:13px}
  .room.portrait .ft.k-sofa .plab b{color:var(--ink)}
  .room.portrait .mtag i{display:none}
  .room.portrait .rdots{display:none}
  .tv.pv-list .plan-wrap{display:none} .tv.pv-list .tlist{display:block}
  .pvt{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:14px; background:var(--soft); margin-bottom:14px}
  .pvt button{height:44px; border-radius:11px; font-weight:800; color:var(--ink-2)}
  .pvt button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--sh)}
  .arrbar{padding:12px 14px} .arrbar p{min-width:0; flex-basis:100%}
  .legend{margin-top:10px}
}
.cnt-row .ttl small{display:block}
.btn.arr-go{margin-top:6px}
</style>

let PDRAG=null;
document.addEventListener('pointerdown',e=>{
  if(!S.arrange||e.button>0) return;
  const el=e.target.closest('.ft[data-ft]'); if(!el||e.target.closest('.ftb')) return;
  const it=planItem(el.dataset.ft); if(!it) return;
  const room=el.closest('.room'), u=room.getBoundingClientRect().width/1000;
  PDRAG={el,it,u,sx:e.clientX,sy:e.clientY,ox:it.x,oy:it.y,moved:false};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  const d=PDRAG; if(!d) return;
  const dx=(e.clientX-d.sx)/d.u, dy=(e.clientY-d.sy)/d.u;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6) return;
  if(!d.moved){ d.moved=true; d.el.classList.add('drag'); }
  const [bw,bh]=pdim(d.it), H=CFG.plan.h||620, snap=v=>Math.round(v/10)*10;
  d.it.x=Math.min(1000-bw/2,Math.max(bw/2,snap(d.ox+dx)));
  d.it.y=Math.min(H-bh/2,Math.max(bh/2,snap(d.oy+dy)));
  d.el.style.setProperty('--x',d.it.x); d.el.style.setProperty('--y',d.it.y);
});
const pdrop=()=>{ const d=PDRAG; if(!d) return; PDRAG=null; if(d.moved) saveCfg(); else S.arrSel=S.arrSel===d.it.id?null:d.it.id; render(); };
document.addEventListener('pointerup',pdrop); document.addEventListener('pointercancel',pdrop);
function planFit(it){ const [bw,bh]=pdim(it), H=CFG.plan.h||620; it.x=Math.min(1000-bw/2,Math.max(bw/2,it.x)); it.y=Math.min(H-bh/2,Math.max(bh/2,it.y)); }
function planFree(k){ /* first spot where a new piece doesn't overlap anything */
  const K=PLAN_KINDS[k], H=CFG.plan.h||620, all=planItems();
  for(let y=K.h/2+20;y<=H-K.h/2-10;y+=20) for(let x=K.w/2+20;x<=1000-K.w/2-10;x+=20){
    if(all.every(o=>{ const [w,h]=pdim(o); return Math.abs(o.x-x)>=(w+K.w)/2+10||Math.abs(o.y-y)>=(h+K.h)/2+10; })) return [x,y];
  }

}
function planCount(kind,dir){
  const pl=CFG.plan.tables, sofa=kind==='sofa', ctr=kind==='counter', dt=kind==='darts', mine=pl.filter(t=>PLAN_GROUP(t.k)===kind);
  if(dir>0){
    if(mine.length>=(sofa?3:ctr||dt?2:40)) return;
    let no=1; while(mine.some(t=>t.no===no)) no++;
    let n=pl.length+1; while(pl.some(t=>t.id==='t'+n)) n++;
    const k=sofa?'sofa':ctr?'counter':dt?'darts':'sq4', [x,y]=planFree(k);
    pl.push(ctr?{id:'t'+n,no,k,x,y,r:0,seats:6}:{id:'t'+n,no,k,x,y,r:0}); buildTables(); saveCfg(); render(); toast(sofa?'U shtua një separe':ctr?'U shtua një banak':dt?'U shtua pikado':`U shtua tavolina ${no}`); return;

  if(mine.length<=(kind==='t'?1:0)) return;
  const last=mine.slice().sort((a,b)=>b.no-a.no)[0];

}

  if(k==='q3'){ const ws=weekStart(P.a), n=Math.floor((sod(t)-ws)/(7*864e5))+1; return {title:'Xhiro sipas javës',labels:Array.from({length:n},(_,i)=>{const d=addDays(ws,i*7); return `${d.getDate()}/${d.getMonth()+1}`;}),key:x=>Math.floor((sod(x.t)-ws)/(7*864e5)),n,every:n>10?2:1,tip:i=>`Java nga ${dayLabel(addDays(ws,i*7))}`,cur:n-1,rowT:'Javë pas jave'}; }
  return {title:'Xhiro sipas muajit',labels:MONTHS.map(x=>x.slice(0,3)),key:x=>x.t.getMonth(),n:12,every:1,tip:i=>mName(new Date(t.getFullYear(),i,1)),cur:t.getMonth(),rowT:'Muaj pas muaji'};
}
function bucketSum(list,B,f){ const v=new Array(B.n).fill(0); list.forEach(x=>{ const k=B.key(x); if(k>=0&&k<B.n) v[k]+=f(x); }); return v; }
/* -------- report charts: donut (part of whole), trend lines, busy-hours heatmap --------
   Categorical colors follow the validated reference order (slot 1 blue, 2 orange, 3 aqua, 4 yellow, 5 magenta),
   each category keeps its color in every period. Lighter slots get visible labels (legend list with values). */
const VZ={blue:'#ff5a1f',orange:'#2b2b2b',aqua:'#2bb3a3',yellow:'#f2b630',magenta:'#c050a0',gray:'#b4bcc7'};
const CAT_COLORS={'Kafe':VZ.blue,'Pije':VZ.orange,'Lëngje':VZ.aqua,'Birra':VZ.yellow,'Të tjera':VZ.magenta};
function donut(segs,center,sub){
  const tot=sum(segs,s=>s.v); if(!tot) return '<div class="empty">Ende asnjë shitje në këtë periudhë.</div>';
  const R=80, r=52, cx=100, cy=100; let a0=-Math.PI/2;
  const arc=(s)=>{
    const f=s.v/tot, a1=a0+f*Math.PI*2, big=a1-a0>Math.PI?1:0;
    const p=(ang,rad)=>`${(cx+rad*Math.cos(ang)).toFixed(2)} ${(cy+rad*Math.sin(ang)).toFixed(2)}`;
    const d=f>=0.9999?`M ${p(a0,R)} A ${R} ${R} 0 1 1 ${p(a0+Math.PI*1.999,R)} L ${p(a0+Math.PI*1.999,r)} A ${r} ${r} 0 1 0 ${p(a0,r)} Z`
      :`M ${p(a0,R)} A ${R} ${R} 0 ${big} 1 ${p(a1,R)} L ${p(a1,r)} A ${r} ${r} 0 ${big} 0 ${p(a0,r)} Z`;
    const out=`<path d="${d}" fill="${s.c}" stroke="#fff" stroke-width="2" stroke-linejoin="round" data-tip="${esc(s.l)}\n${fmt(s.v)} · ${Math.round(f*100)}%"/>`;
    a0=a1; return out;
  };
  return `<div class="dn"><div class="dn-c"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(segs.map(s=>`${s.l} ${Math.round(s.v/tot*100)}%`).join(', '))}">${segs.filter(s=>s.v>0).map(arc).join('')}</svg>
    <div class="dn-m"><b>${center}</b><small>${sub}</small></div></div>
    <div class="dn-l">${segs.map(s=>`<div><i style="background:${s.c}"></i><span>${esc(s.l)}</span><b>${fmt(s.v)}</b><em>${Math.round(s.v/tot*100)}%</em></div>`).join('')}</div></div>`;
}
function catSegs(list){
  const by={}; list.forEach(x=>x.lines.forEach(l=>{ const m=M[l.id]; const c=m&&CAT_COLORS[m.c]?m.c:'Të tjera'; by[c]=(by[c]||0)+priceOf(l.id)*l.q; }));
  return Object.keys(CAT_COLORS).map(c=>({l:c,v:by[c]||0,c:CAT_COLORS[c]})).filter(s=>s.v>0).sort((a,b)=>b.v-a.v);
}
function lineChart({labels,series,tips,every=1,h=220,cur=-1}){
  const n=labels.length, max=niceMax(Math.max(1,...series.flatMap(s=>s.values))), W=1000;
  const x=i=>n<=1?W/2:i/(n-1)*W, y=v=>h-(v/max)*h;
  const upto=cur>=0?cur+1:n;
  const paths=series.map(s=>{ const pts=s.values.slice(0,upto).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `${s.area?`<polygon points="0,${h} ${pts} ${x(upto-1).toFixed(1)},${h}" fill="${s.color}" opacity=".10"/>`:''}<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>`; }).join('');
  const cols=labels.map((_,i)=>`<div class="lc" style="left:${n<=1?0:(i-0.5)/(n-1)*100}%;width:${100/Math.max(1,n-1)}%" data-tip="${esc(tips[i])}"><i style="left:50%"></i>${i<upto?series.map(s=>`<b style="bottom:${s.values[i]/max*100}%;background:${s.color}"></b>`).join(''):''}</div>`).join('');
  return `<div class="chart" style="--h:${h}px"><div class="cy">${[max,max/2,0].map((t,k)=>`<span style="top:${k*50}%">${fmtN(t)} €</span>`).join('')}</div>
    <div class="cp"><div class="cg"><i></i><i></i><i></i></div><div class="lw" style="height:${h}px"><svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">${paths}</svg>${cols}</div>
    <div class="lx">${labels.map((l,i)=>i%every===0?`<span style="left:${n<=1?50:i/(n-1)*100}%;transform:translateX(${i===0?'0':i===n-1?'-100%':'-50%'})">${l}</span>`:'').join('')}</div></div></div>`;
}
function heatmap(list){
  const H=[]; for(let h=7;h<=22;h++) H.push(h);
  const g=Array.from({length:7},()=>H.map(()=>({n:0,v:0}))), weeks=new Set();
  list.forEach(x=>{ const hi=x.t.getHours()-7; if(hi<0||hi>=H.length) return; const c=g[dow(x.t)][hi]; c.n++; c.v+=x.total; weeks.add(+weekStart(x.t)); });
  const ns=g.flat().map(c=>c.n), max=Math.max(1,...ns), min=Math.min(...ns.filter(n=>n>0),max), wk=Math.max(1,weeks.size);
  const shade=f=>f<0.5?`color-mix(in oklab, #ff8a5c ${Math.round(f*200)}%, #fff1ea)`:`color-mix(in oklab, #c2410c ${Math.round((f-0.5)*200)}%, #ff8a5c)`;
  let best={n:0}; g.forEach((row,d)=>row.forEach((c,hi)=>{ if(c.n>best.n) best={n:c.n,d,h:H[hi]}; }));
  const cell=(c,d,hi)=>{ const f=max>min?Math.pow((c.n-min)/(max-min),1.15):1; return `<i style="background:${c.n?shade(f):'#e8ebef'}" data-tip="${DAY_LONG[d].replace(/^e /,'E ')} · ${String(H[hi]).padStart(2,'0')}:00\n${(c.n/wk).toFixed(c.n/wk<10?1:0).replace('.',',')} fatura në javë mesatarisht\n${fmt(c.v/wk)} xhiro"></i>`; };
  return `<div class="hm"><div class="hm-g" style="--n:${H.length}"><span></span>${H.map((h,i)=>`<span class="hm-x">${i%2===0?String(h).padStart(2,'0'):''}</span>`).join('')}
    ${g.map((row,d)=>`<span class="hm-y">${DAY_SHORT[d]}</span>${row.map((c,hi)=>cell(c,d,hi)).join('')}`).join('')}</div>
    <div class="hm-f"><span>${best.n?`Më e ngarkuara: <b>${DAY_LONG[best.d].replace(/^e /,'e ')} rreth orës ${String(best.h).padStart(2,'0')}:00</b>`:'Ende pa të dhëna'}</span><span class="hm-k">Pak<i></i>Shumë</span></div></div>`;
}
function reportCharts(k,P,cur){
  const t=now();
  // 1) where the money comes from
  const segs=catSegs(cur), tot=sum(segs,s=>s.v);
  const pie=`<div class="box"><div class="bh"><h3>Ku vjen xhiroja</h3><span class="ahint">sipas kategorisë</span></div>${donut(segs,fmtN(tot)+' €','xhiro')}</div>`;
  // 2) sales vs costs over time (same unit, one axis)
  const TK=k==='day'?'week':k, TP=k==='day'?rperiod('week'):P, TB=buckets(TK,TP), curI=TB.cur!=null?TB.cur:-1;
  const rng=x=>inRange(x.t,TP.a,TP.b);
  const drev=bucketSum(S.sales.filter(rng),TB,x=>x.total), dcost=bucketSum([...S.exp.filter(rng),...S.ledger.filter(rng)],TB,x=>x.amount);
  const acc=a=>{ let r=0; return a.map(v=>r+=v); }, rev=acc(drev), cost=acc(dcost), last=a=>a[Math.max(0,(curI>=0?curI:a.length-1))]||0;
    const line=`<div class="box"><div class="bh"><h3>Xhiro dhe shpenzime <span class="h3s">të mbledhura</span></h3>${legend([['Xhiro',VZ.blue],['Shpenzime dhe paga',VZ.orange]])}</div>
    ${lineChart({labels:TB.labels,every:TB.every,cur:curI,series:[{values:rev,color:VZ.blue,area:true},{values:cost,color:VZ.orange}],tips:TB.labels.map((_,i)=>curI>=0&&i>curI?`${TB.tip(i)}\nende pa ardhur`:`${TB.tip(i)}\nXhiro: ${fmt(drev[i])} · gjithsej ${fmt(rev[i])}\nShpenzime: ${fmt(dcost[i])} · gjithsej ${fmt(cost[i])}\nMbetja deri këtu: ${fmt(rev[i]-cost[i])}`)})}
    <div class="lt"><span>Xhiro <b>${fmt(last(rev))}</b></span><span>Shpenzime dhe paga <b>${fmt(last(cost))}</b></span><span>Mbetja <b class="${last(rev)-last(cost)>=0?'pos':'neg'}">${fmt(last(rev)-last(cost))}</b></span></div></div>`;
  // 3) busiest hours (use at least the last 4 weeks so "today" still has a pattern)
  const HA=k==='day'||k==='week'?addDays(sod(t),-28):P.a, HB=k==='day'||k==='week'?addDays(sod(t),1):P.b;
  const heat=`<div class="box"><div class="bh"><h3>Kur ka më shumë punë</h3><span class="ahint">${k==='day'||k==='week'?'4 javët e fundit':P.label} · fatura sipas ditës dhe orës</span></div>${heatmap(S.sales.filter(x=>inRange(x.t,HA,HB)))}</div>`;
  return `<div class="cols vz">${pie}${line}</div>${heat}`;
}

function unitsOf(id){ const o=S.orders[id], u=[]; if(!o) return u; o.rounds.forEach((r,ri)=>r.items.forEach((it,ii)=>{ for(let k=0;k<it.q;k++) u.push({key:`${ri}:${ii}:${k}`,ri,ii,id:it.id,n:r.n}); })); return u; }
function selLines(keys,id){ const g={}; unitsOf(id).filter(u=>keys.includes(u.key)).forEach(u=>g[u.id]=(g[u.id]||0)+1); return Object.entries(g).map(([id,q])=>({id,q})); }
function removeUnits(id,keys){
  const o=S.orders[id]; if(!o) return; const c={};
  unitsOf(id).filter(u=>keys.includes(u.key)).forEach(u=>{ const k=u.ri+':'+u.ii; c[k]=(c[k]||0)+1; });
  Object.entries(c).forEach(([k,n])=>{ const [ri,ii]=k.split(':').map(Number); o.rounds[ri].items[ii].q-=n; });
  cleanup(id);
}

function eqPay(method){
  const id=S.split.id, o=S.orders[id]; if(!o) return;
  if(!o.parts){ o.parts={n:S.split.n||2,paid:0,base:total(o)}; o.prepaid=o.prepaid||0; }
  const P=o.parts, left=P.n-P.paid;
  if(left<=1){ const tot=total(o), lines=linesOf(o);
    S.sales.push({t:now(),table:id,lines,total:tot,method,part:`${P.n}/${P.n}`});
    printReceipt(`${tname(id)} · pjesa ${P.n} nga ${P.n}`,[],tot,method);
    delete S.orders[id]; toast(`Tavolina u pagua plotësisht · ${fmt(tot)}`); afterSplit(id); return; }
  const amt=Math.round(P.base/P.n*100)/100;
  S.sales.push({t:now(),table:id,lines:[],total:amt,method,part:`${P.paid+1}/${P.n}`});
  printReceipt(`${tname(id)} · pjesa ${P.paid+1} nga ${P.n}`,[],amt,method);
  o.prepaid=Math.round(((o.prepaid||0)+amt)*100)/100; P.paid++;
  toast(`Pjesa ${P.paid} nga ${P.n} u pagua · ${fmt(amt)}`); render(); splitModal();
}

function occIn(r,y,m){

const CLOSEKEY='orders-closings-v1';
function saveClose(){ try{ localStorage.setItem(CLOSEKEY, JSON.stringify(S.closings.map(c=>({...c,t:c.t.toISOString(),from:c.from.toISOString()})))); }catch(e){} }
function seedClosings(){
  try{ const d=JSON.parse(localStorage.getItem(CLOSEKEY)||'null'); if(Array.isArray(d)) return d.map(c=>({...c,t:new Date(c.t),from:new Date(c.from)})); }catch(e){}
  const L=[], diffs=[0,-1.5,0.5,0,-0.3,2,0];
  for(let k=7;k>=1;k--){
    const day=addDays(sod(now()),-k), from=new Date(day); from.setHours(6,0,0,0); const t=new Date(day); t.setHours(23,10,0,0);
    const cash=sum(S.sales.filter(x=>x.method==='Kesh'&&inRange(x.t,from,t)),x=>x.total), card=sum(S.sales.filter(x=>x.method!=='Kesh'&&inRange(x.t,from,t)),x=>x.total);
    const out=sum(S.exp.filter(e=>e.arka&&inRange(e.t,from,t)),e=>e.amount), adv=sum(S.ledger.filter(e=>e.type==='avans'&&inRange(e.t,from,t)),e=>e.amount);
    const fl=50, exp=fl+cash-out-adv, diff=diffs[k-1]||0, counted=Math.round((exp+diff)*100)/100;
    L.push({id:'c'+k,from,t,float:fl,cash,card,out,adv,expected:exp,counted,diff,left:50,taken:Math.round((counted-50)*100)/100,by:CFG.staff[k%CFG.staff.length]});
  }
  return L;
}
const closings=()=>S.closings||(S.closings=seedClosings());
function drawer(){
  const C=closings(), last=C[C.length-1], t=now();
  const from=last?last.t:sod(t);
  const fl=last?last.left:50, eff=S.floatOverride!=null?S.floatOverride:fl;
  const sales=S.sales.filter(x=>x.t>from&&x.t<=t), cash=sum(sales.filter(x=>x.method==='Kesh'),x=>x.total), card=sum(sales.filter(x=>x.method!=='Kesh'),x=>x.total);
  const exps=S.exp.filter(e=>e.arka&&e.t>from&&e.t<=t), out=sum(exps,e=>e.amount);
  const advs=S.ledger.filter(e=>e.type==='avans'&&e.t>from&&e.t<=t), adv=sum(advs,e=>e.amount);
  const house=S.house.filter(x=>x.t>from&&x.t<=t);
  const sins=S.stock.filter(m=>m.type==='in'&&m.t>from&&m.t<=t), sout=0;
  const owner=S.exp.filter(e=>!e.arka&&e.t>from&&e.t<=t);
  return {last,from,float:eff,sales,cash,card,exps,out,advs,adv,house,sins,sout,owner,expected:eff+cash-out-adv-sout};
}

/* -------- stock (fridge drinks: counted per bottle/can) --------
   Movements in S.stock: {id, t, type:'in'|'count', by, items:[{id,q,exp?}], paid?, arka?, note?}
   'in'    = a delivery from the supplier (adds bottles; optional amount paid, maybe from the cash drawer)
   'count' = a stock count (sets the real number per item; the difference shows what went missing)
   Sales, "nga shtëpia" and saved rounds on open tables take bottles off automatically. */
const STOCK_CATS=['Pije','Lëngje','Birra'];
const isTracked=m=>m.track!==undefined?!!m.track:STOCK_CATS.includes(m.c);
const tracked=()=>MENU.filter(isTracked);
const minOf=m=>m.min!=null?m.min:6;
function stockLevels(){
  const out={}, last={};
  for(const mv of S.stock) if(mv.type==='count') for(const it of mv.items){ if(!last[it.id]||mv.t>last[it.id].t) last[it.id]={t:mv.t,q:it.q}; }
  for(const m of tracked()){ const b=last[m.id]; out[m.id]={q:b?b.q:0,since:b?b.t:null}; }
  for(const mv of S.stock) if(mv.type==='in') for(const it of mv.items){ const o=out[it.id]; if(o&&(!o.since||mv.t>o.since)) o.q+=it.q; }
  const vals=Object.values(out), minT=vals.length&&vals.every(o=>o.since)?Math.min(...vals.map(o=>+o.since)):0;
  const take=list=>{ for(let i=list.length-1;i>=0;i--){ const x=list[i]; if(+x.t<minT) break; for(const l of x.lines){ const o=out[l.id]; if(o&&(!o.since||x.t>o.since)) o.q-=l.q; } } };
  take(S.sales); take(S.house);
  for(const o of Object.values(S.orders)) for(const r of o.rounds) if(r.saved) for(const i of r.items){ const x=out[i.id]; if(x&&(!x.since||r.t>x.since)) x.q-=i.q; }
  return out;
}
const lowList=L=>S.stock.length?tracked().filter(m=>L[m.id]&&L[m.id].q<=minOf(m)):[]; /* nothing to reorder until stock has been counted or received */
function soldUnits(a,b){
  const c={}; const add=list=>list.forEach(x=>{ if(x.t>a&&x.t<=b) x.lines.forEach(l=>{ if(M[l.id]&&isTracked(M[l.id])) c[l.id]=(c[l.id]||0)+l.q; }); });
  add(S.sales); add(S.house); return c;
}

}

function cntDiff(v,exp){ if(v==null||v===''||exp==null) return ''; const d=Number(v)-exp; return d===0?'<b class="ok">Në rregull</b>':d<0?`<b class="minus">Mungojnë ${-d}</b>`:`<b class="plus">+${d} tepër</b>`; }
function cntSum(L){
  const c=S.skCnt||{}; let miss=0, val=0, n=0;
  const first=!S.stock.some(m=>m.type==='count');
  if(first){ const k=Object.values(c).filter(v=>v!==''&&v!=null).length; return k?`Numëruar ${k} artikuj · ky bëhet stoku fillestar`:'Shkruaj sa copë numërove.'; }
  for(const [id,v] of Object.entries(c)){ if(v===''||v==null||!M[id]) continue; n++; const d=L[id].q-Number(v); if(d>0){ miss+=d; val+=d*(M[id].cost||M[id].p); } }
  return n?(miss?`Numëruar ${n} artikuj · mungojnë <b>${miss} copë</b> (~${fmt(val)})`:`Numëruar ${n} artikuj · asgjë nuk mungon`):'Shkruaj sa copë numërove.';
}

const XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const EXP_PERIODS=[['day','Sot'],['week','Kjo javë'],['month','Ky muaj'],['last','Muaji i kaluar'],['year','Këtë vit'],['all','Të gjitha']];
const XSLUG={bills:'faturat',lines:'shitjet-sipas-artikullit',house:'nga-shtepia',exp:'shpenzimet',wages:'pagat',closings:'mbylljet-e-dites',stock:'stoku',moves:'levizjet-e-stokut'};
const EXP_SETS=[['bills','Faturat'],['lines','Shitjet sipas artikullit'],['house','Nga shtëpia'],['exp','Shpenzimet'],['wages','Pagat dhe avanset'],['closings','Mbylljet e ditës'],['stock','Gjendja e stokut'],['moves','Lëvizjet e stokut']];
function expRange(k){
  const t=now(), y=t.getFullYear(), m=t.getMonth();
  if(k==='day') return [sod(t),addDays(sod(t),1),dayLabel(t)];
  if(k==='week') return [weekStart(t),addDays(sod(t),1),'kjo javë'];
  if(k==='month') return [new Date(y,m,1),new Date(y,m+1,1),mName(new Date(y,m,1))];
  if(k==='last') return [new Date(y,m-1,1),new Date(y,m,1),mName(new Date(y,m-1,1))];
  if(k==='year') return [new Date(y,0,1),new Date(y+1,0,1),String(y)];
  return [new Date(2000,0,1),new Date(2100,0,1),'të gjitha'];
}
const r2=n=>Math.round((n||0)*100)/100;
const dStr=d=>`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
function expTables(k){
  const [a,b]=expRange(k), inR=x=>x.t>=a&&x.t<b, nm=id=>M[id]?M[id].n:id, tn=id=>id?tname(id):'';

  T.lines={name:'Shitjet sipas artikullit',head:['Data','Ora','Tavolina','Artikulli','Kategoria','Sasia','Çmimi (€)','Vlera (€)','Pagesa'],rows:S.sales.filter(inR).flatMap(x=>x.lines.map(l=>[dStr(x.t),hm(x.t),tn(x.table),nm(l.id),M[l.id]?M[l.id].c:'',l.q,r2(priceOf(l.id)),r2(priceOf(l.id)*l.q),x.method]))};
  T.house={name:'Nga shtëpia',head:['Data','Ora','Tavolina','Artikujt','Vlera (€)','Arsyeja','Kush'],rows:S.house.filter(inR).map(x=>[dStr(x.t),hm(x.t),x.table==='house'?'':tn(x.table),x.lines.map(l=>`${l.q}× ${nm(l.id)}`).join(', '),r2(x.total),x.reason||'',x.by||''])};
  T.exp={name:'Shpenzimet',head:['Data','Ora','Kategoria','Përshkrimi','Shuma (€)','Paguar nga','Kush'],rows:S.exp.filter(inR).sort((x,y)=>x.t-y.t).map(e=>[dStr(e.t),hm(e.t),e.cat,e.note||'',r2(e.amount),e.arka?'Arka':'Pronari',e.by||''])};
  T.wages={name:'Pagat dhe avanset',head:['Data','Punëtori','Lloji','Për muajin','Shuma (€)','Shënim'],rows:S.ledger.filter(inR).sort((x,y)=>x.t-y.t).map(e=>[dStr(e.t),e.who,e.type==='paga'?'Paga':'Avans',e.month||'',r2(e.amount),e.note||''])};
  T.closings={name:'Mbylljet e ditës',head:['Data','Ora','Fondi (€)','Kesh (€)','Kartelë (€)','Blerje nga arka (€)','Avanse (€)','Duhet (€)','Numëruar (€)','Diferenca (€)','Lënë për nesër (€)','Merr pronari (€)','Kush'],rows:closings().filter(inR).map(c=>[dStr(c.t),hm(c.t),r2(c.float),r2(c.cash),r2(c.card),r2(c.out),r2(c.adv),r2(c.expected),r2(c.counted),r2(c.diff),r2(c.left),r2(c.taken),c.by||''])};
  const L=stockLevels();
  T.stock={name:'Gjendja e stokut',head:['Artikulli','Kategoria','Në stok','Minimumi','Çmimi i blerjes (€)','Çmimi i shitjes (€)','Vlera e stokut (€)'],rows:tracked().map(m=>[m.n,m.c,L[m.id].q,minOf(m),m.cost?r2(m.cost):'',r2(m.p),m.cost?r2(Math.max(0,L[m.id].q)*m.cost):''])};
  T.moves={name:'Lëvizjet e stokut',head:['Data','Ora','Lloji','Artikulli','Sasia','Pritej','Paguar (€)','Kush'],rows:S.stock.filter(inR).sort((x,y)=>x.t-y.t).flatMap(mv=>mv.items.map((i,j)=>[dStr(mv.t),hm(mv.t),mv.type==='in'?'Pranim':'Inventurë',nm(i.id),i.q,mv.type==='count'&&i.exp!=null?i.exp:'',j===0&&mv.paid?r2(mv.paid):'',mv.by||'']))};
  return T;
}
function csvOf(t){
  const cell=v=>{ const s=String(v==null?'':v); return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  return '﻿'+[t.head,...t.rows].map(r=>r.map(cell).join(',')).join('\r\n');
}
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=XLSX_SRC; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('xlsx')); document.head.appendChild(s); });
}
async function saveFile(filename,data){
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){ try{ await dl.save({filename,data}); return true; }catch(e){ if(e&&e.code==='declined') return false; } }
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true;
}

    <p class="qhint">${F==='xlsx'?'Një skedar, me një fletë për secilën pjesë.':'Një skedar CSV për secilën pjesë që zgjodhe.'}</p>

async function doExport(){
  const P=S.xp||'month', F=S.xf||'xlsx', sel=S.xs||[], T=expTables(P), tag=expRange(P)[2].replace(/\s+/g,'-').toLowerCase();
  if(!sel.length) return;

  let X; try{ X=await loadXlsx(); }catch(e){ toast('Excel nuk u ngarkua. Provo CSV.'); return; }

/* -------- reset data: today, this week, this month, last month, or everything (settings stay) -------- */
const RESET_KINDS=[['day','Sot'],['week','Kjo javë'],['month','Ky muaj'],['last','Muaji i kaluar'],['all','Të gjitha']];
function resetRange(kind){
  const t=now(), y=t.getFullYear(), m=t.getMonth(), END=new Date(8.64e15);
  if(kind==='day') return {a:drawer().from,b:END,live:true};
  if(kind==='week') return {a:weekStart(t),b:END,live:true};
  if(kind==='month') return {a:new Date(y,m,1),b:END,live:true};
  if(kind==='last') return {a:new Date(y,m-1,1),b:new Date(y,m,1),live:false};
  return {a:new Date(-8.64e15),b:END,live:true,all:true};
}
function resetScope(kind){
  const R=resetRange(kind), inR=x=>x.t>=R.a&&x.t<R.b;
  const openT=R.live?Object.keys(S.orders).filter(id=>!isAcct(id)):[], openA=CFG.accounts.filter(a=>S.orders[a.id]);
  return {...R,
    sales:S.sales.filter(inR).length, house:S.house.filter(inR).length, exp:S.exp.filter(inR).length, ledger:S.ledger.filter(inR).length,
    stock:S.stock.filter(inR).length, closings:closings().filter(inR).length, tables:openT.length,
    accts:R.all?openA.length:sum(openA,a=>S.orders[a.id].rounds.filter(inR).length)};
}
function resetDesc(kind,R){
  const t=now();
  if(kind==='day') return `Fshihet gjithçka që u regjistrua që nga ${sod(R.a).getTime()===sod(t).getTime()?'sot në '+hm(R.a):dayLabel(R.a)+' '+hm(R.a)} (hapja e ditës), si të mos kishte ndodhur.`;
  if(kind==='week') return `Fshihet gjithçka nga ${dayLabel(R.a)} deri tani, bashkë me tavolinat e hapura.`;
  if(kind==='month') return `Fshihet gjithçka nga 1 ${MONTHS[R.a.getMonth()]} deri tani, bashkë me tavolinat e hapura.`;
  if(kind==='last') return `Fshihet vetëm muaji ${MONTHS[R.a.getMonth()]} ${R.a.getFullYear()}. Sot dhe tavolinat e hapura nuk preken.`;
  return 'Aplikacioni kthehet si i ri. Menyja, çmimet, tavolinat, stafi, pagat, klientët dhe kujtesat mbeten.';
}

async function doReset(){
  const c=document.getElementById('rs-conf'); if(!c||c.value.trim().toUpperCase()!=='FSHI'){ toast('Shkruaj FSHI për të konfirmuar'); if(c) c.focus(); return; }
  if(typeof backupBeforeReset==='function'){ const ok=await backupBeforeReset(); if(!ok){ toast('Backup dështoi · asgjë nuk u fshi'); return; } }
  const kind=S.rk, R=resetRange(kind), keep=x=>!(x.t>=R.a&&x.t<R.b);
  const goneExp=new Set(S.exp.filter(x=>!keep(x)).map(e=>e.id));
  S.sales=S.sales.filter(keep); S.house=S.house.filter(keep); S.exp=S.exp.filter(keep); S.ledger=S.ledger.filter(keep); S.stock=S.stock.filter(keep);
  S.closings=closings().filter(keep);
  Object.keys(S.orders).forEach(id=>{
    if(!isAcct(id)){ if(R.live) delete S.orders[id]; return; }
    if(R.all){ delete S.orders[id]; return; }
    const o=S.orders[id]; o.rounds=o.rounds.filter(keep); if(!o.rounds.length) delete S.orders[id]; });
  if(R.all) S.done={}; else Object.keys(S.done).forEach(k=>{ if(goneExp.has(S.done[k])) delete S.done[k]; });
  if(R.live){ S.counted=null; S.leftFloat=null; S.floatOverride=null; S.sel=null; S.table=null; }
  saveExp(); saveLedger(); saveRem(); saveStock(); saveClose();
  const lbl=RESET_KINDS.find(k=>k[0]===kind)[1];
  closeModal(); S.view='tables'; render(); scrollTo(0,0); toast(R.all?'Të gjitha të dhënat u fshinë':`U fshinë të dhënat · ${lbl.toLowerCase()}`);
}

    S.house.push({t:now(),table:id,lines:linesOf(o),total:total(o),reason:S.hreason,by:S.staff});
    delete S.orders[id]; closeModal(); S.sel=null; S.table=null; S.view=id==='house'?'house':'tables'; render(); scrollTo(0,0);
    toast(`U regjistrua nga shtëpia · ${fmt(S.house[S.house.length-1].total)}`); return;
  }
  if(d.act==='backsplit'){ S.pendingHouse=null; splitModal(); return; }
  if(d.toacct){ S.mv={from:d.toacct,acc:null,who:null}; moveModal(); return; }
  if(d.mvacc){ S.mv.acc=d.mvacc; S.mv.who=null; moveModal(); return; }
  if(d.mvwho){ S.mv.who=S.mv.who===d.mvwho?null:d.mvwho; moveModal(); return; }
  if(d.act==='mvok'){
    const {from,acc,who}=S.mv, o=S.orders[from]; if(!o||!acc) return;
    const tgt=S.orders[acc]||(S.orders[acc]={opened:now(),status:'open',by:S.staff,rounds:[]}), val=total(o);
    o.rounds.forEach(r=>{ if(!r.items.length) return; tgt.rounds.push({n:tgt.rounds.length+1,t:r.t,by:r.by,from:isTable(from)?from:null,items:r.items.map(i=>({id:i.id,q:i.q})),saved:true}); });
    delete S.orders[from]; closeModal(); S.sel=null; S.table=null; S.view='tables'; S.mv=null; render(); scrollTo(0,0);
    toast(`${tname(from)} kaloi te ${tname(acc)} · ${fmt(val)}`); return;
  }
  if(d.who){ S.who=S.who===d.who?null:d.who; document.querySelectorAll('[data-who]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.who===S.who)); return; }
  if(d.split){ const so=S.orders[d.split]; S.split={id:d.split, sel:[], mode:so&&so.parts?'eq':'items', n:so&&so.parts?so.parts.n:2}; splitModal(); return; }
  if(d.unit){ const k=d.unit, a=S.split.sel; S.split.sel=a.includes(k)?a.filter(x=>x!==k):[...a,k]; splitModal(); return; }
  if(d.ssel){ const u=unitsOf(S.split.id); S.split.sel=d.ssel==='all'?u.map(x=>x.key):d.ssel==='none'?[]:u.filter(x=>'r'+x.ri===d.ssel).map(x=>x.key); splitModal(); return; }
  if(d.spay){ splitPay(d.spay); return; }
  if(d.shouse){ const id=S.split.id, keys=S.split.sel.slice(); houseModal(id,{lines:selLines(keys,id),keys}); return; }
  if(d.repeat){
    const id=d.repeat;
    if(d.fill){ repeatRound(id,false); render(); return; }
    const r=repeatRound(id,true); if(r){ render(); toast(`${tname(id)} · Raundi ${r.n} u shtua · ${fmt(roundTotal(r))}`); } return;
  }
  if(d.ep){ S.ep=d.ep; render(); return; }
  if(d.xcat){ S.xcat=d.xcat; document.querySelectorAll('[data-xcat]').forEach(b=>b.setAttribute('aria-pressed',b===el)); return; }
  if(d.delexp){ S.exp=S.exp.filter(e=>e.id!==d.delexp); S.stock.forEach(m=>{ if(m.exp===d.delexp){ m.paid=null; m.exp=null; m.arka=false; } }); saveStock(); saveExp(); render(); toast('Shpenzimi u fshi'); return; }
  if(d.delacc){ if(S.orders[d.delacc]){ toast('Ky klient ka llogari pa paguar'); return; } const a=acct(d.delacc); CFG.accounts=CFG.accounts.filter(x=>x.id!==d.delacc); saveCfg(); render(); toast(`${a.name} u fshi`); return; }
  if(d.cm!==undefined){ S.cm=d.cm==='0'?0:S.cm+Number(d.cm); S.cday=null; render(); return; }
  if(d.act==='remhere'){ S.fdate=S.cday; S.cday=null; render(); const f=document.getElementById('remform'); if(f){ f.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>{ const i=document.getElementById('rm-t'); if(i) i.focus(); },350); } return; }
  if(d.cday!==undefined){ S.cday=d.cday&&S.cday!==d.cday?d.cday:null; render(); return; }
  if(d.rrep){ S.rrep=d.rrep; document.querySelectorAll('[data-rrep]').forEach(b=>b.setAttribute('aria-pressed',b===el)); return; }
  if(d.done){
    const k=d.done, r=S.rem.find(x=>x.id===k.split(':')[0]);
    if(S.done[k]){ const ex=S.done[k]; delete S.done[k]; if(typeof ex==='string'){ S.exp=S.exp.filter(e=>e.id!==ex); saveExp(); } saveRem(); render(); toast('U hoq si e kryer'); return; }
    let ex=true; if(r&&r.amount&&EXCATS.includes(r.cat)){ ex='x'+Date.now(); S.exp.push({id:ex,t:now(),cat:r.cat,note:r.title,amount:r.amount,by:S.staff}); saveExp(); }
    S.done[k]=ex; saveRem(); render(); toast(ex===true?`${r.title} u shënua e kryer`:`${r.title} u pagua · u shtua te shpenzimet`); return;
  }
  if(d.sm){ S.sm=Math.min(0,S.sm+Number(d.sm)); render(); return; }
  if(d.act==='pdf'){ downloadPDF(); return; }
  if(d.act==='closeday'){ doClose(); return; }
  if(d.act==='qexp'){ S.qsrc='arka'; qexpModal(); return; }
  if(d.qcat){ S.qcat=d.qcat; qexpModal(); const a=document.getElementById('qx-amt'); if(a){ a.focus(); a.select(); } return; }
  if(d.act==='qexpok'){
    const v=parseP(document.getElementById('qx-amt').value), note=document.getElementById('qx-note').value.trim();
    if(!v){ toast('Shkruaj shumën që pagove'); return; }
    S.exp.push({id:'x'+Date.now(),t:now(),cat:S.qcat,note:note||S.qcat,amount:v,by:S.staff,src:'staff',arka:(S.qsrc||'arka')==='arka',payer:(S.qsrc||'arka')==='arka'?null:'pronari'}); saveExp(); closeModal(); render(); toast(`${note||S.qcat} · ${fmt(v)} u shtua`); return;
  }
  if(d.qdel){ S.exp=S.exp.filter(e=>e.id!==d.qdel); saveExp(); render(); qexpModal(); toast('U fshi'); return; }
  if(d.pm){ S.pm=Math.min(0,S.pm+Number(d.pm)); render(); return; }
  if(d.adv){ advModal(d.adv); return; }
  if(d.amt){ document.querySelectorAll('[data-amt]').forEach(b=>b.setAttribute('aria-pressed',b===el)); document.getElementById('adv-amt').value=d.amt; return; }
  if(d.act==='advok'){
    const v=parseP(document.getElementById('adv-amt').value), note=document.getElementById('adv-note').value.trim();
    if(!v){ toast('Shkruaj shumën e avansit'); return; }
    const t=now(); S.ledger.push({id:'e'+Date.now(),t,who:advFor,type:'avans',amount:v,note,month:mKey(t)}); saveLedger();
    closeModal(); S.pm=0; render(); toast(`Avans ${fmt(v)} për ${advFor}`); return;
  }
  if(d.paysal){ salModal(d.paysal); return; }
  if(d.act==='salok'){
    const m=monthOf(S.pm), i=wInfo(salFor,mKey(m)); if(i.paid) return;
    S.ledger.push({id:'e'+Date.now(),t:now(),who:salFor,type:'paga',amount:i.rem,note:'',month:mKey(m)}); saveLedger();
    closeModal(); render(); toast(`Paga u pagua · ${salFor} · ${fmt(i.rem)}`); return;
  }
  if(d.key!==undefined){
    if(d.key==='⌫') S.pin=S.pin.slice(0,-1); else if(S.pin.length<4) S.pin+=d.key;
    if(S.pin.length===4){ if(S.pin==='1234'){ S.admin=true; S.pin=''; render(); toast('U hap'); } else { S.pin=''; render(); toast('PIN i gabuar'); } } else render();
    return;
  }
  if(d.act==='lock'){ S.admin=false; S.pm=0; S.sm=0; S.cm=0; S.cday=null; S.view='tables'; render(); scrollTo(0,0); return; }
  if(d.acat){ S.acat=d.acat; render(); return; }
  if(d.delitem){
    const id=d.delitem; if(Object.values(S.orders).some(o=>linesOf(o).some(l=>l.id===id))){ toast('Ky artikull është në një porosi të hapur'); return; }
    if(MENU.filter(m=>m.c===M[id].c).length<=1){ toast('Kategoria duhet të ketë të paktën një artikull'); return; }
    const n=M[id].n; MENU.splice(MENU.findIndex(m=>m.id===id),1); delete M[id]; saveCfg(); render(); toast(`${n} u fshi`); return;
  }
  if(d.pv){ S.pv=d.pv; try{ localStorage.setItem('xbar-pv',d.pv); }catch(_){} render(); return; }
  if(d.tadd){ planCount(d.tadd,Number(d.dir)); return; }
  if(d.pseat){ const c=CFG.plan.tables.find(t=>t.k==='counter'); if(!c) return; const cur=c.seats||6, nv=cur+Number(d.pseat);
    if(nv<1||nv>10) return; if(nv<cur&&S.orders[c.id+'s'+cur]){ toast(`${tname(c.id+'s'+cur)} ka porosi të hapur`); return; }
    c.seats=nv; planFit(c); buildTables(); saveCfg(); render(); return; }
  if(d.pcol){ const F=CFG.plan.fixtures=CFG.plan.fixtures||[], cols=F.filter(f=>f.k==='col');
    if(Number(d.pcol)>0){ if(cols.length>=8) return; let n=1; while(F.some(f=>f.id==='col'+n)) n++; const [x,y]=planFree('col'); F.push({id:'col'+n,k:'col',x,y,r:0}); }
    else { if(!cols.length) return; F.splice(F.indexOf(cols[cols.length-1]),1); }
    saveCfg(); render(); return; }
  if(d.act==='arrange'){ S.arrange=true; S.arrSel=null; S.sel=null; S.filter='all'; S.view='tables'; render(); scrollTo(0,0); return; }
  if(d.act==='arrdone'){ S.arrange=false; S.arrSel=null; saveCfg(); render(); toast('Salla u ruajt'); return; }
  if(d.act==='prot'){ const it=planItem(d.id); if(it){ it.r=((it.r||0)+90)%360; planFit(it); saveCfg(); render(); } return; }
  if(d.act==='pflip'){ const it=planItem(d.id); if(it){ it.m=!it.m; saveCfg(); render(); } return; }
  if(d.act==='pshape'){ const it=planItem(d.id); if(it){ it.k=TABLE_SHAPES[(TABLE_SHAPES.indexOf(it.k)+1)%TABLE_SHAPES.length]; planFit(it); buildTables(); saveCfg(); render(); } return; }
  if(d.act==='proomh'){ const H=Math.min(1200,Math.max(400,(CFG.plan.h||620)+Number(d.dir))); if(planItems().some(o=>o.y+pdim(o)[1]/2>H-8)){ toast('Lëviz fillimisht tavolinat që janë poshtë'); return; } CFG.plan.h=H; saveCfg(); render(); return; }
  if(d.delstaff){ if(CFG.staff.length<=1) return; CFG.staff=CFG.staff.filter(n=>n!==d.delstaff); if(!CFG.staff.includes(S.staff)) S.staff=CFG.staff[0]; saveCfg(); render(); toast(`${d.delstaff} u hoq`); return; }
  if(d.sel){ if(!S.orders[d.sel]){ S.view='order'; S.table=d.sel; S.sel=null; S.q=''; render(); scrollTo(0,0); return; } S.sel=S.sel===d.sel?null:d.sel; render(); return; }
  if(d.open){ S.who=null; S.view='order'; S.table=d.open; S.sel=isTable(d.open)||isAcct(d.open)?d.open:null; S.q=''; render(); scrollTo(0,0); return; }
  if(d.cat){ S.cat=d.cat; S.q=''; render(); return; }
  if(d.add){
    const dr=ensureDraft(S.table);
    const l=dr.items.find(x=>x.id===d.add); l?l.q++:dr.items.push({id:d.add,q:1});
    render(); return;
  }
  if(d.sub){
    const dr=lastDraft(S.orders[S.table]), l=dr&&dr.items.find(x=>x.id===d.sub);
    if(!l) return;
    l.q--; cleanup(S.table); render(); return;
  }
  if(d.inc!==undefined){ lastDraft(S.orders[S.table]).items[+d.inc].q++; render(); return; }
  if(d.dec!==undefined){ lastDraft(S.orders[S.table]).items[+d.dec].q--; cleanup(S.table); render(); return; }
  if(d.act==='jump'){ document.getElementById('op').scrollIntoView({behavior:'smooth'}); return; }
  if(d.act==='save'){ const t=S.table, o=S.orders[t], n=unsent(o), dr=lastDraft(o); if(dr){ dr.saved=true; dr.t=now(); dr.by=S.staff; if(isAcct(t)) dr.from=null; } S.view='tables'; S.table=null; render(); scrollTo(0,0); toast(dr?(isAcct(t)?`U shtua te ${tname(t)} · ${fmt(roundTotal(dr))}`:`${tname(t)} · Raundi ${dr.n} u ruajt`):`${tname(t)} u ruajt`); S.who=null; return; }
  if(d.act==='staff'){ const st=CFG.staff; S.staff=st[(st.indexOf(S.staff)+1)%st.length]; render(); toast('Në ndërrim: '+S.staff); return; }
  if(d.pay){ pay(d.id||S.table, d.pay); return; }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(layer.innerHTML){ closeModal(); render(); } else if(S.sel){ closeSheet(); } });
setInterval(()=>{ const c=document.getElementById('clock'); if(c) c.textContent=hm(now()); if(S.view==='tables'&&!layer.innerHTML&&!S.sel) render(); },30000);
let tipEl=null;
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){ if(tipEl) tipEl.hidden=true; return; }
  if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='ctip'; document.body.appendChild(tipEl); }
  const lines=t.dataset.tip.split('\n'); tipEl.innerHTML=`<b>${esc(lines[0])}</b>`+lines.slice(1).map(l=>`<span>${esc(l)}</span>`).join('');
  const r=t.getBoundingClientRect(); tipEl.hidden=false;
  tipEl.style.left=Math.min(innerWidth-110,Math.max(110,r.left+r.width/2))+'px'; tipEl.style.top=(r.top+12)+'px';
});
render();
</script>
