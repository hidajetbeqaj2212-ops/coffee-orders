<!doctype html><html><head><meta charset="utf-8">
<!-- XBar wordmark and app icon. Render with tools/brand/render.py. Archivo (SIL Open Font License). -->
<style>
@font-face{font-family:Archivo;font-weight:100 900;font-stretch:62% 125%;src:url(archivo-wdth.woff2)}
html,body{margin:0;background:transparent}
#mark{display:inline-block;padding:4px 6px;color:#111;font:900 120px/1 Archivo;font-stretch:125%;letter-spacing:-.03em}
#icon{width:512px;height:512px;border-radius:112px;background:#111;color:#fff;display:grid;place-items:center;font:900 330px/1 Archivo;font-stretch:125%;letter-spacing:-.03em}
#icon span{transform:translateY(-4%)}
</style></head><body>
<div id="mark">XBar</div>
<div style="height:40px"></div>
<div id="icon"><span>X</span></div>
</body></html>
